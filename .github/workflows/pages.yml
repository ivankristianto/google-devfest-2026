name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish instead of cancelling it halfway, as in GitHub's Pages starter.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages on a free account needs a public repo, so skip quietly until then.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # download: true makes the build export a PDF, which needs Chromium.
      - run: npx playwright install --with-deps chromium

      - run: npm run slides:pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job, because deploy-pages in the same job as the upload can miss the fresh artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
